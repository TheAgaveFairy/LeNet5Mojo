[workspace]
authors = ["Paul Dutton <jodgey4@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "LeNet5Mojo"
platforms = ["linux-64", "osx-arm64"]
version = "0.2.0"

[tasks]
formatall = "mojo format src/*.mojo src/cpu/*.mojo src/accel/*.mojo tests/*.mojo"
buildall = { cmd = "bash scripts/build_all.sh", cwd = "." }
doit = {cmd = "mojo src/main.mojo", cwd = "."}
bench = {cmd = "mojo src/main.mojo --bench-only", cwd = "."}
benchgemm = { cmd = "mojo -I src tests/gemm.mojo", cwd = "." } # -D CPU_TILE_SIZE=n / -D GPU_TILE_SIZE=n to sweep
sanitize = { cmd = "mojo build -g2 -O1 --sanitize=address -Xlinker -lm src/main.mojo && ./main"}
cdebug = { cmd = "mojo build -g2 -O1 --debug-info-language=C -Xlinker -lm src/main.mojo"}
buildmain = { cmd = "mojo build -Xlinker -lm main.mojo", cwd = "src" }
nsysprofile = { cmd = "nsys profile --trace=nvtx,cuda --force-overwrite=true --output=basic mojo src/main.mojo --bench-only && nsys stats --force-export=true basic.nsys-rep", cwd = "."}
nsysprofile_gpu = { cmd = "nsys profile --trace=nvtx,cuda --force-overwrite=true --output=gpu_profile mojo -I src tests/profile_gpu.mojo && nsys stats --force-export=true gpu_profile.nsys-rep", cwd = "."}
ncuprofile_gpu = { cmd = "ncu --set basic --launch-count 80 --target-processes all -o ncu_gpu mojo -I src tests/profile_gpu.mojo", cwd = "."}
# Steady-state clock lock for reproducible benchmarking/profiling (needs sudo,
# run in a real terminal). Lock once per session, not per profile run.
gpulock = { cmd = "sudo scripts/gpu_lock.sh", cwd = "."}
gpuunlock = { cmd = "sudo scripts/gpu_unlock.sh", cwd = "."}

# ── Per-GPU tuned runs ────────────────────────────────────────────────────────
# Same source, machine-specific knobs. `doit`/`bench` use the compiled-in
# defaults from constants.mojo; these override them with values actually
# MEASURED on that card by scripts/grid_search_gpu.sh.
#
# The tuning is per-GPU, not per-platform, so it cannot live in constants.mojo
# or a [target.*] block — one binary, different best knobs. Hence one task per
# card, named for the card.
#
# Every tuned entry carries the date and the source CSV. If you cannot point at
# a CSV, the numbers are a guess and should say so — an untuned task that reads
# as tuned is worse than no task, because it silently launders a default into
# looking like a measurement.
#
# Retune after kernel changes:
#   BS_VALUES="..." STREAM_VALUES="..." bash scripts/grid_search_gpu.sh
# DIV_CHANS_CONV2/CONV3 are tuned separately (scripts/sweep_div_chans.sh) and
# are not folded in here yet — add them per-card once measured.

# TUNED — the constants.mojo defaults (GPU_STREAM_BATCH_SIZE=100,
# NUM_GPU_STREAMS=12) ARE the RTX 3070 tuning, so this passes no overrides. It
# exists so the tuned config is named rather than implicit: `doit` and `rtx3070`
# run identically today, but only one of them still means "3070-tuned" after
# someone changes a default.
rtx3070 = { cmd = "mojo src/main.mojo", cwd = "." }

# TUNED 2026-08-03 — results/grid_search_gpu_20260803_*.csv
# bs=500 s=2 -> 1133797 fps @ 1.8%. Peak of a constant-eff_batch sweep that
# isolated stream count from batch size: s=1 -> s=2 is +23%, s>=4 is 12-18%
# worse at the SAME eff_batch, so 2 streams is the knee, not a plateau edge.
# The 3070 tuning above measures ~874k on this card; NVIDIA knobs do not transfer.
rx7600 = { cmd = "mojo -D GPU_STREAM_BATCH_SIZE=500 src/main.mojo --num-streams 2", cwd = "." }

# UNTUNED — runs the compiled-in defaults (which are 3070 values) and says so.
# Replace the cmd with a tuned invocation once scripts/grid_search_gpu.sh has
# been run there, and cite the CSV like rx7600 above.
metal   = { cmd = "echo 'metal: UNTUNED — running RTX 3070 defaults. Run scripts/grid_search_gpu.sh on this box and update pixi.toml.' >&2 && mojo src/main.mojo", cwd = "." }

# Mojo shells out to `xcrun metal` to build the .metallib. xcrun resolves that
# through the active developer dir, and a Command Line Tools instance has no
# `metal` — you get "Metal Compiler failed to compile metallib". Point it at the
# full Xcode here so the fix travels with the repo (the alternative,
# `sudo xcode-select -s`, is machine-global and needs root).
[target.osx-arm64.activation.env]
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"

[dependencies]
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.1,<3"
mojo = ">=1.0.0b3.dev2026073121,<2"
pandas = ">=3.0.5,<4"
max = ">=26.5.0.dev2026073121,<27"

# Linux-only, and vendor-neutral: this is the sysroot the conda `ld` links
# against, needed on the AMD box as much as the NVIDIA one. The floor must be
# >= the glibc symbol versions Mojo's own runtime .so files reference — at
# 1.0.0b3.dev2026073121 that is GLIBC_2.34 (pthread_create, dlopen, sem_init).
# Pinned at 2.28 it linked against a sysroot older than those symbols and
# `mojo build` died with ~40 "undefined reference to ...@GLIBC_2.34" from
# libKGENCompilerRTShared/libAsyncRT*/libNVPTX. `mojo run` never hit this: the
# JIT resolves through the dynamic loader against system glibc at load time and
# skips the version check entirely.
#
# gcc is here because `mojo build` shells out to a C compiler to drive the final
# link, and it used to arrive as a transitive dep of cuda-toolkit — dropping the
# toolkit turned the glibc link error into "unable to find suitable c compiler
# for linking". Ubuntu ships no compiler by default (`gcc-N-base` is not one),
# so nothing else supplies it. Needed on every linux-64 host, GPU vendor
# irrelevant, hence declared here rather than arriving by accident.
#
# It must be the `gcc` METAPACKAGE, not `gcc_linux-64`. The mojo driver searches
# PATH for the literal name `cc`: it ignores $CC (which pixi activation does set,
# to the prefixed x86_64-conda-linux-gnu-cc) and never looks for `clang`.
# gcc_linux-64 installs prefixed names only, so it does not satisfy the search;
# the metapackage adds the unprefixed cc/gcc/c++/g++ symlinks that do. Verified
# by symlinking `cc` onto both gcc and clang — either links fine under that name,
# so this is a naming constraint in the driver, not a real gcc dependency.
[target.linux-64.dependencies]
sysroot_linux-64 = ">=2.34,<3"
gcc = ">=14,<17"

# CUDA toolchain, opt-in via the `cuda` environment: `pixi run -e cuda doit`.
# pixi resolves at lock time and cannot probe the host for an actual NVIDIA GPU
# (platform is as fine-grained as it gets), so vendor has to be an explicit
# environment rather than something detected. Plain `pixi run` is the AMD/CPU
# path and never downloads the toolkit; ROCm there comes from the system
# package manager, not conda. Both environments share a solve group so mojo/max
# resolve to identical versions across them.
[feature.cuda.target.linux-64.dependencies]
cuda-toolkit = ">=13.3.1,<14"

[environments]
default = { solve-group = "main" }
cuda = { features = ["cuda"], solve-group = "main" }
